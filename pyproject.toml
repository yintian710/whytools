[project]
name = "why-tools"
version = "0.2.25"
description = "一个偏脚手架 / 内部工具箱风格的 Python 工具集合"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["ytools", "why-tools"]
dependencies = [
    "better_exceptions==0.3.3",
    "importlib-metadata==7.1.0",
    "loguru==0.7.3",
    "packaging>=24.0",
]

[[project.authors]]
name = "yintian"
email = "yintian710@gmail.com"

[[project.maintainers]]
name = "yintian"
email = "yintian710@gmail.com"

[project.urls]
Homepage = "https://github.com/yintian710/whytools"
Repository = "https://github.com/yintian710/whytools"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "objprint>=0.2.3",
    "drissionpage>=4.1.1.4",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["test", "demo", "old"]

[tool.setuptools.package-data]
ytools = ["VERSION"]

[tool.uv]
default-groups = ["dev"]
